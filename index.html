<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffe500"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png"><link rel="stylesheet" href="styles.css"><title>Estamparte Recibos</title></head><body>
<header><img src="logo.jpg" alt="Estamparte"><p>Imperio de Bizancio 1004, Juventud 2000 · Mexicali, B.C.<br>WhatsApp: 686 406 1365</p></header>
<main><h1>Comprobante de pago</h1><section><h2>Cliente</h2><label>Nombre *<input id="nombre" placeholder="Aidé Catequistas"></label><label>Teléfono<input id="telefono" type="tel" placeholder="686 000 0000"></label><label>Correo (opcional)<input id="correo" type="email" placeholder="correo@ejemplo.com"></label><label>Fecha<input id="fecha" type="date"></label></section>
<section><h2>Artículos</h2><div id="articulos"></div><button id="agregar" class="light" type="button">+ Agregar artículo</button></section>
<section><h2>Pago</h2><label>IVA<select id="iva"><option value="0">Sin IVA</option><option value="0.08">IVA 8%</option><option value="0.16">IVA 16%</option></select></label><label>Anticipo recibido ($)<input id="anticipo" type="number" min="0" step="0.01" value="0"></label><label>Observaciones (opcional)<textarea id="notas" rows="2"></textarea></label><div class="resumen"><p>Subtotal <b id="subtotal">$0.00</b></p><p>IVA <b id="impuesto">$0.00</b></p><p class="amarillo">Total <b id="total">$0.00</b></p><p>Anticipo <b id="adelanto">$0.00</b></p><p>Saldo pendiente <b id="saldo">$0.00</b></p></div></section>
<button id="descargar" type="button">Descargar PDF</button><button id="compartir" class="light" type="button">Compartir PDF</button><button id="nuevo" class="neutral" type="button">Nuevo recibo</button><p id="estado" role="status"></p></main><footer>TU IDEA · NUESTRA TINTA · TU ESTILO</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="app.js"></script></body></html>
